name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit (high and above)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/